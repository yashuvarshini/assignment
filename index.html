<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varshini Vote Check</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="vote-icon">🗳️</div>

        <h1>Vote Eligibility</h1>

        <p class="subtitle">Check your eligibility to vote</p>

        <label>Full Name</label>
        <input type="text" id="name" value="Varshini">

        <label>Age</label>
        <input type="number" id="age" placeholder="Enter your age">

        <label>Nationality</label>
        <select id="nationality">
            <option value="">Select nationality</option>
            <option value="indian">Indian</option>
            <option value="other">Other</option>
        </select>

        <button onclick="checkEligibility()">
            Check Eligibility
        </button>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
